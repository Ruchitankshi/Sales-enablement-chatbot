<!DOCTYPE html>
<html>
<head>
  <title>Sales Assist Bot</title>
  <style>
    body { font-family: Arial; background:#f5f5f5; padding:20px; }
    #chat { max-width:600px; margin:auto; background:#fff; padding:15px; border-radius:8px; }
    .msg { margin:10px 0; }
    .user { font-weight:bold; }
    .bot { color:#333; }
  </style>
</head>
<body>

<div id="chat">
  <div id="messages"></div>

  <input id="input" placeholder="Type your message…" style="width:80%" />
  <button onclick="send()">Send</button>
</div>

<script>
const sessionId = "web-" + Math.random().toString(36).slice(2);

async function send() {
  const input = document.getElementById("input");
  const msg = input.value;
  input.value = "";

  document.getElementById("messages").innerHTML +=
    `<div class="msg user">You: ${msg}</div>`;

  const res = await fetch("https://theriacal-myrna-smirkily.ngrok-free.dev/webhook/sales-chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: msg,
      sessionId: sessionId
    })
  });

  const data = await res.json();

  document.getElementById("messages").innerHTML +=
    `<div class="msg bot">Bot: ${data.answer}</div>`;
}
</script>

</body>
</html>
