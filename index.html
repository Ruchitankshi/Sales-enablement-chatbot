<!DOCTYPE html>
<html>
<head>
  <title>Sales Assist Bot</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    #chat {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg {
      margin: 10px 0;
      white-space: pre-wrap;
    }
    .user {
      font-weight: bold;
    }
    .bot {
      color: #333;
    }
    #input {
      width: 75%;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<div id="chat">
  <div id="messages"></div>
  <input id="input" placeholder="Type your message…" />
  <button id="sendBtn" onclick="send()">Send</button>
</div>

<script>
  function getOrCreateSession() {
    let sid = localStorage.getItem("salesbot-session-id");
    if (!sid) {
      sid = "web-" + crypto.randomUUID();
      localStorage.setItem("salesbot-session-id", sid);
    }
    return sid;
  }

  let sessionId = getOrCreateSession();

  const inputEl = document.getElementById("input");
  const messages = document.getElementById("messages");
  const sendBtn = document.getElementById("sendBtn");

  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") send();
  });

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = "";
    sendBtn.disabled = true;

    messages.innerHTML += `<div class="msg user">You: ${msg}</div>`;
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch(
        "https://theriacal-myrna-smirkily.ngrok-free.dev/webhook/web-sales-chat",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            sessionId
          })
        }
      );

      if (!res.ok) throw new Error("HTTP " + res.status);

      let botReply = await res.text();

      // 🔑 HANDLE SESSION END
      if (botReply.includes("[END_SESSION]")) {
        botReply = botReply.replace("[END_SESSION]", "").trim();

        // Reset session for next conversation
        localStorage.removeItem("salesbot-session-id");
        sessionId = getOrCreateSession();
      }

      messages.innerHTML += `<div class="msg bot">Bot: ${botReply}</div>`;

    } catch (err) {
      console.error("Frontend error:", err);
      messages.innerHTML +=
        `<div class="msg bot">Bot: Server error. Please try again.</div>`;
    } finally {
      sendBtn.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }
</script>

</body>
</html>
