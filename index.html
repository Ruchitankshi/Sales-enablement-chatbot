<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sales Assist Bot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    #chat {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #messages {
      max-height: 400px;
      overflow-y: auto;
      margin-bottom: 10px;
    }

    .msg {
      margin: 10px 0;
    }

    .user {
      font-weight: bold;
    }

    .bot {
      color: #333;
    }

    input {
      width: 75%;
      padding: 8px;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="chat">
  <div id="messages"></div>

  <input
    id="input"
    placeholder="Type your message…"
    onkeydown="if(event.key === 'Enter') send()"
  />
  <button onclick="send()">Send</button>
</div>

<script>
  /*  PERSISTENT SESSION ID (CRITICAL) */
  let sessionId = localStorage.getItem("salesbot-session-id");

  if (!sessionId) {
    sessionId = "web-" + crypto.randomUUID();
    localStorage.setItem("salesbot-session-id", sessionId);
  }

  const messagesEl = document.getElementById("messages");
  const inputEl = document.getElementById("input");

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = "";

    messagesEl.innerHTML += `
      <div class="msg user">You: ${msg}</div>
    `;
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const res = await fetch(
        "https://theriacal-myrna-smirkily.ngrok-free.dev/webhook/web-sales-chat",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            sessionId: sessionId
          })
        }
      );

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const data = await res.json();

      messagesEl.innerHTML += `
        <div class="msg bot">
          Bot: ${data.answer || "Thanks, noted."}
        </div>
      `;
    } catch (err) {
      console.error(err);
      messagesEl.innerHTML += `
        <div class="msg bot">
          Bot: Error connecting to server. Please try again.
        </div>
      `;
    }

    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
</script>

</body>
</html>
