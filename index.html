<!DOCTYPE html>
<html>
<head>
  <title>Sales Assist Bot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    #chat {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .msg {
      margin: 10px 0;
    }
    .user {
      font-weight: bold;
    }
    .bot {
      color: #333;
    }
    input {
      width: 75%;
      padding: 8px;
    }
    button {
      padding: 8px 12px;
    }
  </style>
</head>
<body>

<div id="chat">
  <div id="messages"></div>

  <input id="input" placeholder="Type your message…" />
  <button id="sendBtn" onclick="send()">Send</button>
</div>

<script>
  // ✅ Stable session ID (CRITICAL for memory)
  let sessionId = localStorage.getItem("salesbot-session-id");

  if (!sessionId) {
    sessionId = "web-" + crypto.randomUUID();
    localStorage.setItem("salesbot-session-id", sessionId);
  }

  async function send() {
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const msg = inputEl.value.trim();
    if (!msg) return;

    inputEl.value = "";
    sendBtn.disabled = true;

    const messages = document.getElementById("messages");
    messages.innerHTML += `<div class="msg user">You: ${msg}</div>`;
    messages.scrollTop = messages.scrollHeight;

    try {
      const res = await fetch(
        "https://theriacal-myrna-smirkily.ngrok-free.dev/webhook/web-sales-chat",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: msg,
            sessionId: sessionId
          })
        }
      );

      if (!res.ok) {
        throw new Error("HTTP " + res.status);
      }

      const data = await res.json();

      // ✅ IMPORTANT: message FIRST, then answer
      const botReply =
        data.message ||
        data.answer ||
        "Thanks! Processing your request…";

      messages.innerHTML +=
        `<div class="msg bot">Bot: ${botReply}</div>`;
      messages.scrollTop = messages.scrollHeight;

    } catch (err) {
      messages.innerHTML +=
        `<div class="msg bot">Bot: Server error. Please try again.</div>`;
      console.error(err);
    } finally {
      sendBtn.disabled = false;
    }
  }
</script>

</body>
</html>
